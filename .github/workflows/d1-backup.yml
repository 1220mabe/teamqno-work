name: D1 backup

# A weekly encrypted export of the accounts database (docs/SECURITY.md, "Backup and restore"). Off until the owner sets
# the repository variable D1_BACKUP_ENABLED to "true" and adds the secrets D1_BACKUP_TOKEN (a Cloudflare API token with
# D1 access for this account only, nothing else), CLOUDFLARE_ACCOUNT_ID and D1_BACKUP_PASSPHRASE. The dump holds
# session hashes and deck data, so it is encrypted before it leaves the runner and kept 30 days as a private workflow
# artifact (never a release, never a commit, never a cache). About one minute a week; skipped jobs cost nothing.
on:
  schedule:
    - cron: "30 5 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d1-backup
  cancel-in-progress: false

jobs:
  export:
    if: ${{ vars.D1_BACKUP_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: 1220mabe/sideboard-sage
          ssh-key: ${{ secrets.SOURCE_KEY }}
          persist-credentials: false
          sparse-checkout: apps/sync/wrangler.toml
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Export and encrypt
        working-directory: apps/sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.D1_BACKUP_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PASSPHRASE: ${{ secrets.D1_BACKUP_PASSPHRASE }}
        run: |
          [ -n "$PASSPHRASE" ] || { echo "D1_BACKUP_PASSPHRASE is not set"; exit 1; }
          npx --yes wrangler@4 d1 export sideboard-sage-sync --remote --output "$RUNNER_TEMP/d1.sql" > /dev/null
          [ -s "$RUNNER_TEMP/d1.sql" ] || { echo "empty export"; exit 1; }
          mkdir -p "$RUNNER_TEMP/out"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:PASSPHRASE -in "$RUNNER_TEMP/d1.sql" -out "$RUNNER_TEMP/out/d1-$(date -u +%Y-%m-%d).sql.enc"
          rm -f "$RUNNER_TEMP/d1.sql"
          ls -l "$RUNNER_TEMP/out"
      - name: Keep the encrypted dumps on the private backups branch (the newest 12)
        env:
          GIT_SSH_COMMAND: ssh -i ${{ runner.temp }}/key -o StrictHostKeyChecking=accept-new
          SOURCE_WRITE_KEY: ${{ secrets.SOURCE_WRITE_KEY }}
        run: |
          umask 077
          printf '%s\n' "$SOURCE_WRITE_KEY" > "$RUNNER_TEMP/key"
          git clone --quiet --depth 1 --branch backups git@github.com:1220mabe/sideboard-sage.git "$RUNNER_TEMP/b" 2>/dev/null \
            || { git init --quiet "$RUNNER_TEMP/b"; git -C "$RUNNER_TEMP/b" checkout --quiet -b backups; git -C "$RUNNER_TEMP/b" remote add origin git@github.com:1220mabe/sideboard-sage.git; }
          cp "$RUNNER_TEMP"/out/*.enc "$RUNNER_TEMP/b/"
          cd "$RUNNER_TEMP/b"
          ls -1 *.enc | sort | head -n -12 | xargs -r git rm -q --
          git config user.name "backup-bot"; git config user.email "backup-bot@users.noreply.github.com"
          git add -A && git commit -q -m "d1 backup $(date -u +%F)"
          git push -q origin backups
          rm -f "$RUNNER_TEMP/key"
