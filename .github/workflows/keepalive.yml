name: Keep alive

# GitHub pauses scheduled workflows in a public repository after 60 days without activity. One small commit a month
# keeps the schedules running.
on:
  schedule:
    - cron: "11 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # The next step pushes with the job token, so the credential stays (no artifacts are uploaded here).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 # zizmor: ignore[artipacked]
      - run: |
          date -u +%F > .keepalive
          git config user.name "keepalive-bot"
          git config user.email "keepalive-bot@users.noreply.github.com"
          git add .keepalive
          git commit -q -m "Keep alive $(date -u +%F)"
          git push -q
      - name: Tell Discord when the run failed
        if: failure()
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          [ -n "$HOOK" ] || exit 0
          MSG="**Keep alive: Failed**"$'\n'"Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl -fsS --max-time 15 -H 'Content-Type: application/json' -d "$(jq -n --arg c "$MSG" '{content:$c, allowed_mentions:{parse:[]}}')" "$HOOK" || true
