name: Dependency audit

# Weekly: asks the package registries whether any dependency we ship has a known high or critical vulnerability and
# sends a Discord message when it does (the runner repo is public, so no Issue).
on:
  schedule:
    - cron: "40 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: 1220mabe/sideboard-sage
          ssh-key: ${{ secrets.SOURCE_KEY }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: apps/web/package.json
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Web dependencies
        id: web
        working-directory: apps/web
        continue-on-error: true
        run: pnpm audit --prod --audit-level=high 2>&1 | tee ../../web-audit.txt
      - name: Pipeline dependencies
        id: py
        working-directory: pipeline
        continue-on-error: true
        run: |
          uv export --no-dev --no-hashes -o ../requirements-audit.txt >/dev/null 2>&1
          uvx pip-audit -r ../requirements-audit.txt --progress-spinner off 2>&1 | tee ../py-audit.txt
      # Runtime drift (Issue #100): a newer major of Next.js, React or the Node LTS line than the one we ship is a
      # reminder, not a failure. Reads the registries only; about 5 seconds.
      - name: Runtime and framework majors
        id: drift
        working-directory: apps/web
        run: |
          : > ../../drift.txt
          for pkg in next react tailwindcss; do
            have=$(jq -r --arg p "$pkg" '(.dependencies[$p] // .devDependencies[$p] // "") | ltrimstr("^") | ltrimstr("~") | split(".")[0]' package.json)
            [ -n "$have" ] || continue
            latest=$(curl -fsS --max-time 15 "https://registry.npmjs.org/$pkg/latest" | jq -r '.version | split(".")[0]') || continue
            [ "$have" = "$latest" ] || echo "$pkg $have -> $latest" >> ../../drift.txt
          done
          ci_node=$(grep -m1 'node-version:' ../../runner/ci.yml 2>/dev/null | grep -o '[0-9]*' || true)
          lts=$(curl -fsS --max-time 15 https://nodejs.org/dist/index.json | jq -r '[.[] | select(.lts != false)][0].version | ltrimstr("v") | split(".")[0]') || lts=""
          [ -n "$lts" ] && [ -n "$ci_node" ] && [ "$ci_node" != "$lts" ] && echo "node $ci_node -> LTS $lts" >> ../../drift.txt || true
          cat ../../drift.txt
      - name: Tell Discord when something was found
        if: steps.web.outcome == 'failure' || steps.py.outcome == 'failure'
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          [ -n "$HOOK" ] || exit 0
          MSG="The weekly dependency audit found known vulnerabilities. Update the packages (a major bump needs a look). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl -fsS --max-time 15 -H 'Content-Type: application/json' -d "$(jq -n --arg c "$MSG" '{content:$c}')" "$HOOK" || true
      - name: Tell Discord about newer majors
        if: always() && hashFiles('drift.txt') != ''
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          [ -n "$HOOK" ] && [ -s drift.txt ] || exit 0
          MSG="Newer major versions exist (plan the upgrade, docs/OPERATIONS.md quarterly checklist): $(tr '\n' ';' < drift.txt | head -c 600)"
          curl -fsS --max-time 15 -H 'Content-Type: application/json' -d "$(jq -n --arg c "$MSG" '{content:$c}')" "$HOOK" || true
