name: Premodern volume check

# One-off (#181): how many Premodern events, matches and decks TopDeck.gg returned for the last 180 days.
# Prints counts only; nothing is stored. Delete this file once the format decision is made.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: 1220mabe/sideboard-sage
          ssh-key: ${{ secrets.SOURCE_KEY }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - name: Count
        working-directory: pipeline
        env:
          TOPDECK_API_KEY: ${{ secrets.TOPDECK_API_KEY }}
        run: |
          uv sync --locked
          uv run python - <<'PY' | tee "$GITHUB_STEP_SUMMARY"
          from collections import Counter
          from sideboard_sage_pipeline import topdeck
          topdeck.FORMATS.append("Premodern")
          events = topdeck.TopDeckClient().tournaments("Premodern", last_days=180)
          months = Counter(e.date[:7] for e in events)
          print(f"Premodern events (180 days): {len(events)}")
          print(f"with matches: {sum(1 for e in events if e.matches)}; matches: {sum(len(e.matches) for e in events)}; decks: {sum(len(e.decks) for e in events)}")
          for m in sorted(months):
              print(f"{m}: {months[m]}")
          PY
