name: Announce test

# Sends one test message to the team's Discord channel through the DISCORD_WEBHOOK_URL secret, so the connection can
# be checked without waiting for a new tournament. Run it by hand: Actions, Announce test, Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Post a test message
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then echo "DISCORD_WEBHOOK_URL is not set"; exit 1; fi
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Content-Type: application/json" \
            -d '{"content":"Team Qno announcements are connected. New tournaments will appear here with an image, a draft and a link.","username":"Team Qno"}' "$HOOK")
          echo "Discord answered $code"
          [ "$code" = "204" ] || [ "$code" = "200" ]
