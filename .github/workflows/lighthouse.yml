name: Lighthouse

# Weekly Lighthouse (mobile, default throttling) of the public site (Issue #218). It measures public URLs only and
# copies no repository code. One run per page; the JSON artifact (scores and LCP only) is kept 7 days and the next
# run compares against it. Fails (the failed run is the alert) when a score drops more than 10 points or LCP > 4 s.
on:
  schedule:
    - cron: "20 6 * * 1"
  workflow_dispatch:

permissions:
  actions: read

concurrency:
  group: lighthouse
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      SITE: https://teamqno.work
      PAGES: "/ /decks/ /meta/ /me/ /tournaments/ /journal/ /cards/"
    steps:
      - name: Previous numbers
        run: |
          mkdir -p prev
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=lighthouse&per_page=1" --jq '.artifacts[0].id // empty')
          if [ -n "$id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > prev.zip && unzip -oq prev.zip -d prev || true
          fi
      - name: Measure
        run: |
          mkdir -p raw
          for p in $PAGES; do
            n=$(echo "$p" | tr '/' '_')
            npx --yes lighthouse@13.0.1 "$SITE$p" --quiet --only-categories=performance --output=json --output-path="raw/$n.json" \
              --chrome-flags="--headless=new --no-sandbox" || true
          done
      - name: Compare
        run: |
          mkdir -p out
          node - <<'JS'
          const fs = require("fs");
          const pages = {};
          for (const f of fs.readdirSync("raw")) {
            try {
              const r = JSON.parse(fs.readFileSync("raw/" + f));
              pages[f.replace(/\.json$/, "")] = {
                score: Math.round(r.categories.performance.score * 100),
                lcp: Math.round(r.audits["largest-contentful-paint"].numericValue),
                cls: +r.audits["cumulative-layout-shift"].numericValue.toFixed(3),
                tbt: Math.round(r.audits["total-blocking-time"].numericValue),
              };
            } catch { /* a page that failed to measure is reported below */ }
          }
          let prev = {};
          try { prev = JSON.parse(fs.readFileSync("prev/lighthouse.json")).pages || {}; } catch {}
          const problems = [];
          const want = process.env.PAGES.split(" ").map((p) => p.replace(/\//g, "_"));
          const path = (k) => k.replace(/_/g, "/");
          for (const k of want) {
            const c = pages[k];
            if (!c) { problems.push(path(k) + ": no result"); continue; }
            if (c.lcp > 4000) problems.push(`${path(k)}: LCP ${c.lcp} ms over 4000`);
            if (prev[k] && prev[k].score - c.score > 10) problems.push(`${path(k)}: score ${prev[k].score} to ${c.score}`);
          }
          fs.writeFileSync("out/lighthouse.json", JSON.stringify({ date: new Date().toISOString().slice(0, 10), pages }, null, 1));
          console.log(JSON.stringify(pages));
          if (problems.length) {
            fs.writeFileSync("problems.txt", problems.join("\n"));
            console.log(problems.join("\n"));
            // Every page's numbers for the message, aligned in a code block (Discord has no tables).
            const rows = [["page", "score", "was", "LCP ms", "CLS", "TBT ms"], ...want.map((k) => {
              const c = pages[k];
              return c ? [path(k), c.score, prev[k]?.score ?? "-", c.lcp, c.cls, c.tbt] : [path(k), "-", prev[k]?.score ?? "-", "-", "-", "-"];
            })].map((r) => r.map(String));
            const w = rows[0].map((_, i) => Math.max(...rows.map((r) => r[i].length)));
            const line = (r) => r.map((v, i) => (i === 0 ? v.padEnd(w[i]) : v.padStart(w[i]))).join("  ");
            fs.writeFileSync("table.txt", ["```", ...rows.map(line), "```"].join("\n"));
          }
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: lighthouse
          path: out/lighthouse.json
          retention-days: 7
      - name: Alert
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -s problems.txt ]; then
            # The annotation keeps one line; the message gets a headline, bullets, every page's numbers and the run.
            echo "::error::Lighthouse regression: $(paste -sd ';' problems.txt | sed 's/;/; /g')"
            msg="**Lighthouse: Regression**"$'\n'"$(sed 's/^/- /' problems.txt)"$'\n'"$(cat table.txt 2>/dev/null)"$'\n'"Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            [ -n "$HOOK" ] && curl -fsS --max-time 15 -H 'Content-Type: application/json' -d "$(jq -n --arg c "$msg" '{content:$c, allowed_mentions:{parse:[]}}')" "$HOOK" || true
            exit 1
          fi
