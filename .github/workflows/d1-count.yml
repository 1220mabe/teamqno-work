name: D1 count

# Numbers for the owner: how many accounts exist, how many signed up in the last 7 days and how many synced anything (#175), and the weekly buy-funnel line (#239: opens, shop clicks and
# click rate per placement, shop clicks toward the stop rule; counts only, nothing about a visitor). Runs with the same
# read token as the backup and prints only these numbers (no emails, no records) to the log and, when the webhook is
# set, to Discord. Off until the owner sets
# the repository variable D1_COUNT_ENABLED to "true" and adds D1_BACKUP_TOKEN and CLOUDFLARE_ACCOUNT_ID. The
# backup-check job below runs on its own whenever D1_BACKUP_ENABLED is "true".
on:
  schedule:
    - cron: "15 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d1-count
  cancel-in-progress: false

jobs:
  count:
    if: ${{ vars.D1_COUNT_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: 1220mabe/sideboard-sage
          ssh-key: ${{ secrets.SOURCE_KEY }}
          persist-credentials: false
          sparse-checkout: |
            apps/sync/wrangler.toml
            apps/sync/src/clickReport.ts
            apps/sync/scripts/click-report.mjs
            apps/web/src/lib/buyKeys.ts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Count accounts
        working-directory: apps/sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.D1_BACKUP_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # created_at is milliseconds (Date.now() in the Worker); "activated" means the account synced at least one record.
          out=$(npx --yes wrangler@4.146.0 d1 execute sideboard-sage-sync --remote --json --command "SELECT COUNT(*) AS n, COALESCE(SUM(created_at >= (CAST(strftime('%s','now') AS INTEGER) - 604800) * 1000), 0) AS week, COALESCE(SUM(records > 0), 0) AS active FROM users")
          n=$(printf '%s' "$out" | jq -r '.[0].results[0].n')
          week=$(printf '%s' "$out" | jq -r '.[0].results[0].week')
          active=$(printf '%s' "$out" | jq -r '.[0].results[0].active')
          for v in "$n" "$week" "$active"; do case "$v" in ''|*[!0-9]*) echo "no count"; exit 1;; esac; done
          # Database size against the free 5 GB; from 3 GB the message says so (the limit stops writes, it never bills).
          size=$(printf '%s' "$out" | jq -r '.[0].meta.size_after // 0')
          mb=$((size / 1048576))
          msg="Accounts: $n ($week new in the last 7 days, $active activated: at least one synced record). Database: $mb MB of 5000."
          [ "$mb" -ge 3000 ] && msg="$msg Over 3 GB: lower the per-account caps or prune (docs/DEPLOY.md, Growth limits)."
          echo "$msg"
          [ -n "$HOOK" ] && curl -fsS --max-time 15 -H 'Content-Type: application/json' -d "$(jq -n --arg c "$msg" '{content:$c}')" "$HOOK" || true
      - name: Buy funnel
        working-directory: apps/sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.D1_BACKUP_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # No clicks table yet (schema not applied) or no counts: one line saying so, never a failure.
          out=$(npx --yes wrangler@4.146.0 d1 execute sideboard-sage-sync --remote --json --command "SELECT day, surface, shop, n FROM clicks WHERE day >= date('now', '-56 days')" 2>/dev/null) || out='[{"results":[]}]'
          msg=$(printf '%s' "$out" | node --no-warnings scripts/click-report.mjs) || exit 0
          echo "$msg"
          [ -n "$HOOK" ] && curl -fsS --max-time 15 -H 'Content-Type: application/json' -d "$(jq -n --arg c "$msg" '{content:$c}')" "$HOOK" || true

  # A backup that silently stopped is the worst kind (docs/RECOVERY.md): on Monday, a day after Sunday's export, check
  # that the newest encrypted dump on the private backups branch is at most 8 days old and not empty. It needs only
  # SOURCE_KEY, runs whenever the backup is on, and prints the age in days, never a file or its contents.
  backup-check:
    if: ${{ vars.D1_BACKUP_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: b
        continue-on-error: true # no branch before the first export: reported as missing below
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: 1220mabe/sideboard-sage
          ref: backups
          path: b
          ssh-key: ${{ secrets.SOURCE_KEY }}
          persist-credentials: false
      - name: Newest backup is recent
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          f=$(find b -maxdepth 1 -name 'd1-*.sql.enc' -size +0 2>/dev/null | sort | tail -n 1)
          rm -rf b
          if [ -z "$f" ]; then
            msg="D1 backup: no dump on the backups branch. Run the D1 backup workflow by hand and read its log."
          else
            d=$(basename "$f" .sql.enc)
            age=$(( ($(date -u +%s) - $(date -u -d "${d#d1-}" +%s)) / 86400 ))
            echo "D1 backup: the newest dump is $age days old."
            [ "$age" -le 8 ] && exit 0
            msg="D1 backup: the newest dump is $age days old (expected weekly). Check the D1 backup workflow (token, passphrase, write key)."
          fi
          echo "$msg"
          [ -n "$HOOK" ] && curl -fsS --max-time 15 -H 'Content-Type: application/json' -d "$(jq -n --arg c "$msg" '{content:$c}')" "$HOOK" || true
          exit 1
