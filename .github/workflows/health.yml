name: Health

# Checks the live site every 6 hours and, when something is wrong, sends a Discord message, so a problem
# is visible without anyone watching (a public Issue would show it to everyone). GitHub also emails the owner about failed scheduled runs.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check the pages, every format's data, and how fresh it is
        run: |
          # The public domain answers 403 to the runner (bot rules), so the full probe goes to the pages.dev copy of the
          # same deploy. The domain itself is checked once: 200 or 403 means it answers; no answer or a 5xx is a problem.
          DOMAIN_CODE=$(curl -sS -L --retry 3 --retry-delay 10 --max-time 20 -o /dev/null -w '%{http_code}' https://teamqno.work/ || true)
          export DOMAIN_CODE
          base="https://sideboard-sage.pages.dev"
          curl -fsS --retry 3 --retry-delay 10 -o /dev/null "$base/"
          curl -fsS --retry 3 --retry-delay 10 -o /dev/null "$base/tournaments/"
          curl -fsS --retry 3 --retry-delay 10 "$base/api/v1/status.json" -o status.json
          curl -fsS --retry 3 --retry-delay 10 "$base/api/v1/news/index.json" -o news.json
          # The format list comes from the data (formats.json, written by the pipeline), so a new format needs no edit here.
          curl -fsS --retry 3 --retry-delay 10 "$base/api/v1/formats.json" -o formats.json
          for f in $(jq -r '.formats[]' formats.json); do
            curl -fsS --retry 3 --retry-delay 10 "$base/api/v1/metagame/$f.json" -o "m-$f.json"
            curl -fsS --retry 3 --retry-delay 10 "$base/api/v1/tournaments/$f/index.json" -o "t-$f.json"
          done
          python3 - <<'PY'
          import json, os, sys
          from datetime import datetime, timezone, timedelta
          now = datetime.now(timezone.utc)
          problems = []
          s = json.load(open("status.json"))
          if s["counts"]["cards"] < 20000:
              problems.append("card count too low")
          code = os.environ.get("DOMAIN_CODE", "")
          print("teamqno.work answered", code or "nothing")
          if code not in ("200", "403"):
              problems.append(f"teamqno.work answered {code or 'nothing'} (expected 200 or 403)")
          fj = json.load(open("formats.json"))
          FORMATS = fj["formats"]
          PAPER_ONLY = set(FORMATS) - set(fj["mtgo"])  # no MTGO event types to check
          for f in FORMATS:
              m = json.load(open(f"m-{f}.json"))
              age = now - datetime.fromisoformat(m["generated_at"])
              print(f, "decks", m["decks"], "age", age)
              if age > timedelta(hours=14):  # checked every 2 hours, deployed at least every 8 (Issue #310); 14 hours is the alarm
                  problems.append(f"{f} data is {age} old")
              if m["decks"] < 150:
                  problems.append(f"{f} has only {m['decks']} decks")
              # The weekly calibration (pipeline calibrate.py) stamps its last WRITTEN run (a kept thin run leaves the file
              # as it was): over 21 days means the job stopped or kept a thin run. Missing (no run yet, or data built
              # before the stamp existed) is a log warning only.
              cat = (m.get("calibration") or {}).get("generated_at")
              if not cat:
                  print(f"::warning::{f}: no calibration date in the data")
              elif now - datetime.fromisoformat(cat) > timedelta(days=21):
                  problems.append(f"{f} calibration is {now - datetime.fromisoformat(cat)} old (the weekly Calibrate job stopped or kept a thin run)")
          # generated_at is the build time, so a stalled source cannot show there: look at the newest event itself (#110).
          newest = ""
          for f in FORMATS:
              t = json.load(open(f"t-{f}.json"))
              events = t.get("events", []) if isinstance(t, dict) else t
              newest = max([newest] + [e.get("date", "") for e in events])
              # Holes the pipeline found ("gaps": [date, type] pairs): a warning only, the list shows the same note.
              for day, kind in (t.get("gaps", []) if isinstance(t, dict) else []):
                  print(f"::warning::{f} {kind}: no MTGO record for {day} (it usually runs that weekday; the source may have missed it)")
          print("newest event", newest)
          if not newest or now.date() - datetime.fromisoformat(newest).date() > timedelta(days=3):
              problems.append(f"no event newer than {newest or 'never'} in any format (a source may have stalled)")
          # Per format and event type (status.json "latest_events"): a stale Challenge fails, a stale League only warns.
          # The limit follows the weekdays the type really runs (Vintage Challenges: Thu, Sat, Sun, so Sun to Thu is normal):
          # the next usual day after the newest event, plus one day of grace (the source posts a day late).
          # A weekday is usual when the type had an event on it in at least 3 of the 4 weeks up to the newest event
          # (the same rule as the pipeline's find_gaps). With no usual weekday found, the fixed limit applies.
          def kind_of(name):
              low = name.lower()
              return next((k for w, k in (("league", "league"), ("challenge", "challenge")) if w in low), None)
          def next_expected(dates, day):
              d0 = datetime.fromisoformat(day).date()
              usual = set()
              for wd in range(7):
                  hits = sum(1 for k in range(4) if (d0 - timedelta(days=(d0.weekday() - wd) % 7 + 7 * k)).isoformat() in dates)
                  if hits >= 3:
                      usual.add(wd)
              for n in range(1, 8):
                  if (d0 + timedelta(days=n)).weekday() in usual:
                      return d0 + timedelta(days=n)
              return None
          today = now.date()
          for f in FORMATS:
              if f in PAPER_ONLY:
                  continue
              latest = s.get("latest_events", {}).get(f, {})
              t = json.load(open(f"t-{f}.json"))
              evs = t.get("events", []) if isinstance(t, dict) else t
              for kind, limit, fails in (("challenge", 3, True), ("league", 2, False)):
                  day = latest.get(kind)
                  if day is None and kind == "league":
                      continue  # not every format runs Leagues
                  expected = None
                  if day is not None:
                      dates = {e.get("date", "") for e in evs if e.get("source") == "modometa" and kind_of(e.get("name", "")) == kind}
                      expected = next_expected(dates, day)
                  if day is None:
                      late = True
                  elif expected is not None:
                      late = (today - expected).days > 1
                  else:
                      late = (today - datetime.fromisoformat(day).date()).days > limit
                  if not late:
                      continue
                  missing = "any day in the window" if day is None else (expected or (datetime.fromisoformat(day) + timedelta(days=1)).date()).isoformat()
                  line = f"{f} {kind}: newest {day or 'none'}, missing {missing} (limit {limit} days if no usual weekday)"
                  if fails:
                      problems.append(line)
                  else:
                      print(f"::warning::{line}")
          # Rule changes the code may not handle yet (pipeline rules_watch.py): never a failure, the next step tells the owner.
          watch = s.get("rules_watch", [])
          for line in watch:
              print(f"::warning::rules watch: {line}")
          # The community deck dictionaries age: a new deck is "Other" until its card conditions are added. Above 20% of
          # a format's decks the owner is told with the rules watch (never a failure; Issue #358).
          for f in FORMATS:
              m = json.load(open(f"m-{f}.json"))
              other = next((a["share"] for a in m["archetypes"] if a["name"] == "Other"), 0)
              if other > 0.20:
                  watch.append(f"{f}: {other:.0%} of decks are unnamed (Other); the deck dictionary may be missing a new deck")
          if watch:
              open("rules.txt", "w").write("\n".join(f"- {w}" for w in watch))
          for src in s.get("stale_sources", []):
              print(f"::warning::saved answer of {src} is older than the limit (stale-if-error); the source may be down")
          n = json.load(open("news.json"))
          nage = now - datetime.fromisoformat(n["generated_at"]).replace(tzinfo=timezone.utc)
          print("news age", nage)
          if nage > timedelta(days=2):
              problems.append(f"news is {nage} old")
          if problems:
              open("problems.txt", "w").write("\n".join(f"- {p}" for p in problems))
              for p in problems:
                  print(f"::error::{p}")
              sys.exit("; ".join(problems))
          PY
      - name: Tell Discord about rule changes (once a day)
        if: success() && hashFiles('rules.txt') != ''
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          [ -n "$HOOK" ] && [ "$(date -u +%H)" -lt 6 ] || exit 0
          fit() { awk -v max="$1" '!cut && n + length($0) + 1 <= max { n += length($0) + 1; print; next } { cut++ } END { if (cut) printf "(%d more line%s cut; the full text is in the run log)\n", cut, (cut == 1 ? "" : "s") }'; }
          MSG="**Rules watch: Review**"$'\n'"The card data shows something the code may not handle yet (update pipeline rules_watch.py once checked):"$'\n'"$(fit 1500 < rules.txt)"
          curl -fsS --max-time 15 -H 'Content-Type: application/json' -d "$(jq -n --arg c "$MSG" '{content:$c, allowed_mentions:{parse:[]}}')" "$HOOK" || true
      - name: Tell Discord when the check failed
        if: failure()
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          [ -n "$HOOK" ] || exit 0
          fit() { awk -v max="$1" '!cut && n + length($0) + 1 <= max { n += length($0) + 1; print; next } { cut++ } END { if (cut) printf "(%d more line%s cut; the full text is in the run log)\n", cut, (cut == 1 ? "" : "s") }'; }
          if [ -s problems.txt ]; then body=$(fit 1500 < problems.txt); else body="- The site or a data file could not be fetched."; fi
          MSG="**Health check: Failed**"$'\n'"$body"$'\n'"Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl -fsS --max-time 15 -H 'Content-Type: application/json' -d "$(jq -n --arg c "$MSG" '{content:$c, allowed_mentions:{parse:[]}}')" "$HOOK" || true

  # Cloudflare API tokens may carry an expiry date (docs/RECOVERY.md, "Expiries and renewals"); a lapsed one stops the
  # deploy, the AI drafts, the visits rollup or the D1 backup. Once a day (the run before 06:00 UTC, or by hand) each
  # token that is set is checked with Cloudflare's own verify call; one Discord message names any that expires within
  # 30 days or is no longer active. No checkout and no third-party code run here, only curl and jq. A call that does
  # not answer is a log warning, never a message.
  tokens:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cloudflare tokens near expiry
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AI_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
          T_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          T_D1_BACKUP_TOKEN: ${{ secrets.D1_BACKUP_TOKEN }}
          T_CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
          T_CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
        run: |
          [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ "$(date -u +%H)" -lt 6 ] || exit 0
          api=https://api.cloudflare.com/client/v4
          soon=$(( $(date -u +%s) + 30 * 86400 ))
          : > tokens.txt
          for name in CLOUDFLARE_API_TOKEN D1_BACKUP_TOKEN CF_AI_TOKEN CF_ANALYTICS_TOKEN; do
            var="T_$name"; tok="${!var}"
            [ -n "$tok" ] || continue
            # A user token answers the first call, an account-owned token the second.
            r=$(curl -sS --max-time 15 -H "Authorization: Bearer $tok" "$api/user/tokens/verify" || true)
            for acct in $ACCOUNT $AI_ACCOUNT; do
              [ "$(jq -r '.success // false' <<<"$r" 2>/dev/null)" != true ] || break
              r=$(curl -sS --max-time 15 -H "Authorization: Bearer $tok" "$api/accounts/$acct/tokens/verify" || true)
            done
            if ! jq -e 'has("success")' <<<"$r" >/dev/null 2>&1; then echo "::warning::$name: the verify call gave no answer"; continue; fi
            status=$(jq -r 'if .success then (.result.status // "unknown") else "invalid" end' <<<"$r")
            expires=$(jq -r '.result.expires_on // empty' <<<"$r")
            echo "$name: $status, expires ${expires:-never}"
            if [ "$status" != active ]; then echo "- $name is $status" >> tokens.txt
            elif [ -n "$expires" ] && [ "$(date -u -d "$expires" +%s)" -lt "$soon" ]; then echo "- $name expires $expires" >> tokens.txt; fi
          done
          [ -s tokens.txt ] || exit 0
          cat tokens.txt
          [ -n "$HOOK" ] || { echo "::error::a Cloudflare token needs renewal and there is no webhook"; exit 1; }
          MSG="**Cloudflare tokens: Renew**"$'\n'"$(cat tokens.txt)"$'\n'"Steps: docs/DEPLOY.md, Runbook, \"Rotate the Cloudflare token\" (the same for each secret named)."
          curl -fsS --max-time 15 -H 'Content-Type: application/json' -d "$(jq -n --arg c "$MSG" '{content:$c, allowed_mentions:{parse:[]}}')" "$HOOK" || true

  # Threads and Instagram tokens last 60 days; each CI run that posts refreshes them with Meta and writes the new expiry
  # date to the social ledger (Actions cache, apps/web/src/lib/socialpost.ts), but that warning stays in the CI log.
  # Once a day this reads the ledger (no token is used or printed: only whether each secret is set) and sends one
  # Discord message when a set token expires within 14 days or has no refresh recorded, which means the refresh stopped
  # (CI not posting, or the token was rejected). SOCIAL_POSTING=off skips it, as it skips the posting.
  meta-tokens:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the social ledger
        if: vars.SOCIAL_POSTING != 'off'
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: social-ledger
          key: social-ledger-none
          restore-keys: social-ledger-
      - name: Threads and Instagram tokens near expiry
        if: vars.SOCIAL_POSTING != 'off'
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          HAS_threads: ${{ secrets.THREADS_TOKEN != '' }}
          HAS_instagram: ${{ secrets.INSTAGRAM_TOKEN != '' }}
        run: |
          [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ "$(date -u +%H)" -lt 6 ] || exit 0
          ledger=social-ledger/ledger.json
          soon=$(( $(date -u +%s) + 14 * 86400 ))
          : > meta.txt
          for net in threads instagram; do
            has="HAS_$net"; [ "${!has}" = true ] || continue
            secret=$([ "$net" = threads ] && echo THREADS_TOKEN || echo INSTAGRAM_TOKEN)
            exp=$(jq -r --arg n "$net" '.tokens[$n].expiresAt // empty' "$ledger" 2>/dev/null || true)
            if [ -z "$exp" ]; then echo "- $secret: no refresh recorded in the social ledger (the daily refresh in CI is not running)" >> meta.txt; continue; fi
            at=$(jq -rn --arg d "$exp" '$d | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601' 2>/dev/null || true)
            echo "$secret: expires $exp"
            if [ -z "$at" ]; then echo "::warning::$secret: unreadable expiry date in the ledger"; continue; fi
            [ "$at" -ge "$soon" ] || echo "- $secret expires $exp" >> meta.txt
          done
          [ -s meta.txt ] || exit 0
          cat meta.txt
          [ -n "$HOOK" ] || { echo "::error::a Meta token needs renewal and there is no webhook"; exit 1; }
          MSG="**Threads and Instagram tokens: Renew**"$'\n'"$(cat meta.txt)"$'\n'"Steps: docs/OPERATIONS.md, \"Bluesky, Mastodon, Threads and Instagram\", setup step 5, then update the secret."
          curl -fsS --max-time 15 -H 'Content-Type: application/json' -d "$(jq -n --arg c "$MSG" '{content:$c, allowed_mentions:{parse:[]}}')" "$HOOK" || true

  # X posting stalls silently (no queue, a rejected token, CI not posting). The Buffer ledger (Actions cache) records the
  # slot of every post it booked; when the newest slot is more than 36 hours old, or the ledger is missing, this sends one
  # Discord message. BUFFER_POSTING=off skips it, as it skips the posting. No token is used or printed.
  x-posting:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the Buffer ledger
        if: vars.BUFFER_POSTING != 'off'
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: buffer-ledger
          key: buffer-ledger-none
          restore-keys: buffer-ledger-
      - name: Newest booked X post
        if: vars.BUFFER_POSTING != 'off'
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          HAS_BUFFER: ${{ secrets.BUFFER_TOKEN != '' }}
        run: |
          [ "$HAS_BUFFER" = true ] || exit 0
          [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ "$(date -u +%H)" -lt 6 ] || exit 0
          ledger=buffer-ledger/ledger.json
          newest=$(jq -r '[.xslots[]?.at] | max // empty' "$ledger" 2>/dev/null || true)
          at=$(jq -rn --arg d "$newest" '$d | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601' 2>/dev/null || true)
          echo "newest booked X post: ${newest:-none}"
          [ -n "$at" ] && [ "$at" -lt $(( $(date -u +%s) - 36 * 3600 )) ] || [ -z "$at" ] || exit 0
          [ -n "$HOOK" ] || { echo "::error::X posting looks stalled and there is no webhook"; exit 1; }
          MSG="**X posting: no post booked for 36 hours** (newest: ${newest:-none})"$'\n'"Check the latest CI run's Buffer step, the BUFFER_TOKEN secret and docs/OPERATIONS.md."
          curl -fsS --max-time 15 -H 'Content-Type: application/json' -d "$(jq -n --arg c "$MSG" '{content:$c, allowed_mentions:{parse:[]}}')" "$HOOK" || true

  # Every alert above and in the other workflows goes through one Discord webhook, and a deleted or mistyped one fails
  # silently. A GET on a live webhook answers 200, so this job fails (and GitHub emails the owner) when the secret is
  # missing or the webhook does not answer 2xx. The URL and the answer (it holds the token) are never printed.
  webhook:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Discord webhook is alive
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          [ -n "$HOOK" ] || { echo "::error::DISCORD_WEBHOOK_URL is not set, so no workflow can send an alert"; exit 1; }
          code=$(curl -sS --retry 3 --retry-delay 10 --max-time 15 -o /dev/null -w '%{http_code}' "$HOOK" 2>/dev/null || true)
          case "$code" in
            2??) echo "Discord webhook answered $code" ;;
            *) echo "::error::the Discord webhook answered ${code:-nothing} (deleted or wrong URL?), so no alert can reach Discord"; exit 1 ;;
          esac
