name: Coverage audit

# Daily (seconds of runtime): events per format and source in the last 14 days, hours from the event day to its
# appearance on the live site, big events (data/big_events.yaml) with no data, and formats whose paper intake went
# quiet. The result is the run summary (#79); problems are also posted to Discord (#52).
# The first-seen ledger lives in the Actions cache, so no secret and no commit is needed.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: 1220mabe/sideboard-sage
          ssh-key: ${{ secrets.SOURCE_KEY }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: pipeline/data/coverage-ledger.json
          key: coverage-ledger-${{ github.run_id }}
          restore-keys: coverage-ledger-
      - name: Audit
        working-directory: pipeline
        run: |
          uv sync --locked
          uv run python -m sideboard_sage_pipeline coverage-audit --alerts ../coverage-alerts.txt | tee "$GITHUB_STEP_SUMMARY"
      - name: Tell Discord about missing paper events
        if: hashFiles('coverage-alerts.txt') != ''
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          [ -n "$HOOK" ] && [ -s coverage-alerts.txt ] || exit 0
          # Whole lines only, under the message limit, with a note when some were left out.
          fit() { awk -v max="$1" '!cut && n + length($0) + 1 <= max { n += length($0) + 1; print; next } { cut++ } END { if (cut) printf "(%d more line%s cut; the full text is in the run log)\n", cut, (cut == 1 ? "" : "s") }'; }
          MSG="**Paper coverage: Gap**"$'\n'"Add the event by hand or check the source (docs/OPERATIONS.md)."$'\n'"$(sed 's/^/- /' coverage-alerts.txt | fit 1500)"$'\n'"Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl -fsS --max-time 15 -H 'Content-Type: application/json' -d "$(jq -n --arg c "$MSG" '{content:$c, allowed_mentions:{parse:[]}}')" "$HOOK" || true
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: pipeline/data/coverage-ledger.json
          key: coverage-ledger-${{ github.run_id }}
      - name: Tell Discord when the run failed
        if: failure()
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          [ -n "$HOOK" ] || exit 0
          MSG="**Coverage audit: Failed**"$'\n'"Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl -fsS --max-time 15 -H 'Content-Type: application/json' -d "$(jq -n --arg c "$MSG" '{content:$c, allowed_mentions:{parse:[]}}')" "$HOOK" || true
