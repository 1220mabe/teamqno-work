name: CI
# The backup schedule (apps/ci-dispatch) starts runs with as_schedule; their own title keeps them out of the manual-deploy
# count in scripts/deploy-guard.sh.
run-name: ${{ inputs.as_schedule == true && 'CI (backup schedule)' || 'CI' }}

# This file lives in the public runner repo; the code it builds is checked out from the private source repo with a deploy
# key. Only the owner can start it: a schedule or a manual run, never a pull request, an issue or another workflow, so
# nobody else can reach a secret. Source of truth: runner/ in the private repo (scripts/publish-runner.sh copies it).
on:
  schedule:
    - cron: "20 */2 * * *" # the runner repo is public, so minutes are free: check every 2 hours, deploy only when worth it (deploy-check)
  workflow_dispatch:
    inputs:
      post:
        description: "Also announce and post new tournaments (a scheduled run always does)"
        type: boolean
        default: true
      reuse_data:
        description: "UI-only change: reuse the data built by the last full run instead of rebuilding it (a scheduled run always rebuilds)"
        type: boolean
        default: false
      catchup_days:
        description: "1 = treat today's tournaments as new, 2 = yesterday's and today's (to announce what a halt skipped; the ledgers stop repeats)"
        type: string
        default: "0"
      force_quarantine:
        description: "Test the quarantine: treat this run's data as failing the data gate (ships the last good data, alerts Discord)"
        type: boolean
        default: false
      as_schedule:
        description: "Behave like a scheduled run: deploy only when worth it (the backup schedule apps/ci-dispatch sets this)"
        type: boolean
        default: false
      force_fallback:
        description: "Rehearse the fallback path: build the last tested commit with fresh data as if main failed, then deploy nothing and post nothing"
        type: boolean
        default: false

permissions: {}

# One run at a time: a deploy must not overlap another, and a scheduled run waits for a manual one.
concurrency:
  group: ci
  cancel-in-progress: false

jobs:
  # Which commit this run is about (the newest of the source repo's main), whether its tests already passed, and the
  # newest earlier commit of main that passed them (the fallback the `verdict` job ships when this one fails).
  ref:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.out.outputs.sha }}
      tested: ${{ steps.out.outputs.tested }}
      fallback: ${{ steps.out.outputs.fallback }}
      discord: ${{ steps.flags.outputs.discord }}
      x: ${{ steps.flags.outputs.x }}
      buffer: ${{ steps.flags.outputs.buffer }}
      social: ${{ steps.flags.outputs.social }}
    steps:
      - name: Which posting secrets are set
        id: flags
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
        run: |
          [ -n "$DISCORD_WEBHOOK_URL" ] && echo "discord=true" >> "$GITHUB_OUTPUT" || true
          [ -n "$X_API_KEY" ] && [ -n "$X_API_SECRET" ] && [ -n "$X_ACCESS_TOKEN" ] && [ -n "$X_ACCESS_SECRET" ] && echo "x=true" >> "$GITHUB_OUTPUT" || true
          [ -n "$BUFFER_TOKEN" ] && [ -n "$BUFFER_CHANNEL_ID" ] && echo "buffer=true" >> "$GITHUB_OUTPUT" || true
          { [ -n "$BSKY_HANDLE" ] && [ -n "$BSKY_APP_PASSWORD" ]; } || { [ -n "$MASTODON_INSTANCE" ] && [ -n "$MASTODON_TOKEN" ]; } || [ -n "$THREADS_TOKEN" ] || [ -n "$INSTAGRAM_TOKEN" ] && echo "social=true" >> "$GITHUB_OUTPUT" || true
      - name: Newest commit of the source repo
        id: pick
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: 1220mabe/sideboard-sage
          ssh-key: ${{ secrets.SOURCE_KEY }}
          ref: main
          sparse-checkout: Makefile
          # Recent history (commits and trees only), so the fallback below can be checked to be an ancestor of main.
          fetch-depth: 200
          filter: blob:none
          persist-credentials: false
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # A commit is tested once: the cache key is saved by the `mark` job after every test passed. Later runs of the same
      # commit only refresh the data and deploy. Only an exact match counts as tested (cache-hit); the prefix match is the
      # most recently saved `tested-` key, the newest commit that passed. A real restore (not lookup-only) of the tiny
      # file keeps that entry in use, so a long-failing main does not let the 7-day eviction drop its fallback.
      - id: tested
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tested
          key: tested-${{ steps.sha.outputs.sha }}
          restore-keys: tested-
      - id: out
        env:
          SHA: ${{ steps.sha.outputs.sha }}
          HIT: ${{ steps.tested.outputs.cache-hit }}
          MATCHED: ${{ steps.tested.outputs.cache-matched-key }}
          # A commit outside the fetched history is "not an ancestor", never a fetch (the key is gone by now anyway).
          GIT_NO_LAZY_FETCH: "1"
        run: |
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          [ "$HIT" = "true" ] && echo "tested=true" >> "$GITHUB_OUTPUT" || echo "tested=false" >> "$GITHUB_OUTPUT"
          # The fallback must be a full sha and this commit (tested: only a force_fallback rehearsal uses it) or an
          # ancestor of it (still on main after a force-push or a revert, within the fetched history). Anything else
          # means no fallback: a failing main then ships nothing.
          fallback=""
          cand="${MATCHED#tested-}"
          if [[ "$cand" =~ ^[0-9a-f]{40}$ ]] && { [ "$cand" = "$SHA" ] || git merge-base --is-ancestor "$cand" "$SHA" 2>/dev/null; }; then
            fallback="$cand"
          fi
          echo "fallback=$fallback" >> "$GITHUB_OUTPUT"
          echo "commit $SHA tested=$HIT fallback=${fallback:-none}"
  # Fast checks, in parallel with the browser tests below.
  web-unit:
    needs: [ref]
    if: ${{ needs.ref.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: 1220mabe/sideboard-sage
          ssh-key: ${{ secrets.SOURCE_KEY }}
          persist-credentials: false
          ref: ${{ needs.ref.outputs.sha }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: bash "$GITHUB_WORKSPACE/scripts/quiet.sh" pnpm lint
      - run: bash "$GITHUB_WORKSPACE/scripts/quiet.sh" pnpm test

  # The optional accounts Worker (apps/sync): typecheck and tests against a real SQL engine, no Cloudflare needed.
  sync-unit:
    needs: [ref]
    if: ${{ needs.ref.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sync
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: 1220mabe/sideboard-sage
          ssh-key: ${{ secrets.SOURCE_KEY }}
          persist-credentials: false
          ref: ${{ needs.ref.outputs.sha }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: apps/sync/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/sync/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: bash "$GITHUB_WORKSPACE/scripts/quiet.sh" pnpm typecheck
      - run: bash "$GITHUB_WORKSPACE/scripts/quiet.sh" pnpm test

  # Passkey sign-in in real Chrome (virtual authenticator) against the Worker code on in-memory SQL.
  sync-e2e:
    needs: [ref]
    if: ${{ needs.ref.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: 1220mabe/sideboard-sage
          ssh-key: ${{ secrets.SOURCE_KEY }}
          persist-credentials: false
          ref: ${{ needs.ref.outputs.sha }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: bash "$GITHUB_WORKSPACE/scripts/quiet.sh" pnpm exec playwright test -c playwright.sync.config.ts

  # Build the static site of the newest commit once: the browser tests and the deploy both use this exact output.
  # `site-fallback` runs the same steps (YAML anchor) for the fallback commit; COMMIT and SITE_ARTIFACT tell them apart.
  site:
    needs: [ref]
    runs-on: ubuntu-latest
    env:
      COMMIT: ${{ needs.ref.outputs.sha }}
      SITE_ARTIFACT: site
    defaults:
      run:
        working-directory: apps/web
    steps: &site-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: 1220mabe/sideboard-sage
          ssh-key: ${{ secrets.SOURCE_KEY }}
          persist-credentials: false
          ref: ${{ env.COMMIT }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/web/.next/cache
          key: next-${{ hashFiles('apps/web/pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**') }}
          restore-keys: next-${{ hashFiles('apps/web/pnpm-lock.yaml') }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          # The optional account feature (docs/ACCOUNTS.md): set the repository variable SYNC_ENABLED to 1 only after the Worker is deployed.
          NEXT_PUBLIC_SYNC_ENABLED: ${{ vars.SYNC_ENABLED }}
          # Service worker kill switch (docs/DEPLOY.md, "Service worker"): the repository variable SW_OFF=1 ships a worker that removes itself.
          NEXT_PUBLIC_SW_OFF: ${{ vars.SW_OFF }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.SITE_ARTIFACT }}
          path: apps/web/out
          retention-days: 1
          compression-level: 1

  # Check every page in a real browser against fixed test data. The runner already has Chrome.
  web-e2e:
    needs: [ref, site]
    if: ${{ needs.ref.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    # Every spec still runs; three runners each take a third (the longest job on the critical path).
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: 1220mabe/sideboard-sage
          ssh-key: ${{ secrets.SOURCE_KEY }}
          persist-credentials: false
          ref: ${{ needs.ref.outputs.sha }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site
          path: apps/web/out
      - run: bash "$GITHUB_WORKSPACE/scripts/quiet.sh" pnpm e2e --shard=${{ matrix.shard }}

  pipeline:
    needs: [ref]
    if: ${{ needs.ref.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: 1220mabe/sideboard-sage
          ssh-key: ${{ secrets.SOURCE_KEY }}
          persist-credentials: false
          ref: ${{ needs.ref.outputs.sha }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - run: uv sync --locked
      - run: bash "$GITHUB_WORKSPACE/scripts/quiet.sh" uv run ruff check .
      - run: bash "$GITHUB_WORKSPACE/scripts/quiet.sh" uv run pytest -q
      # The parameter backtest (Issue #269): the accepted PRIOR_MATCHES, HALF_LIFE_DAYS and LEAGUE_WEIGHT must still beat the
      # values they replaced on the frozen archived months (data/backtest_gate.json). Reads the card file the data job caches.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: pipeline/data
          key: pipeline-data-none
          restore-keys: pipeline-data-
      - name: Backtest gate for the tuned parameters
        run: |
          # A failed Scryfall download is a data problem, not a parameter change: warn and let the deploy go on.
          [ -f data/cards.sqlite ] || uv run python -m sideboard_sage_pipeline cards || { echo "::warning::backtest gate skipped: no card data"; exit 0; }
          uv run python -m sideboard_sage_pipeline backtest-gate

  # The one gate: which commit this run deploys, and by which path. `head`: the newest commit, when it was tested before
  # or every test job above passed now (exactly `success`: a skipped or cancelled test is not a pass). `fallback`: the
  # newest earlier commit that passed (`ref`), rebuilt by the *-fallback jobs, so a failing main still refreshes the
  # data with tested code. Neither: nothing deploys. A new test job must be added to `needs` and to the check below.
  # force_fallback (manual) takes the fallback path as a rehearsal: everything is built, nothing is uploaded or posted.
  verdict:
    needs: [ref, web-unit, sync-unit, sync-e2e, web-e2e, pipeline]
    if: ${{ !cancelled() && needs.ref.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      ship: ${{ steps.pick.outputs.ship }}
      via: ${{ steps.pick.outputs.via }}
      passed: ${{ steps.pick.outputs.passed }}
      rehearsal: ${{ steps.pick.outputs.rehearsal }}
    steps:
      - id: pick
        env:
          SHA: ${{ needs.ref.outputs.sha }}
          TESTED: ${{ needs.ref.outputs.tested }}
          FALLBACK: ${{ needs.ref.outputs.fallback }}
          FORCE: ${{ inputs.force_fallback == true }}
          RESULTS: ${{ needs.web-unit.result }} ${{ needs.sync-unit.result }} ${{ needs.sync-e2e.result }} ${{ needs.web-e2e.result }} ${{ needs.pipeline.result }}
        run: |
          passed=false; rehearsal=false; ship=""; via=""
          [ "$TESTED" != true ] && [ "$RESULTS" = "success success success success success" ] && passed=true
          if [ "$FORCE" = true ]; then
            rehearsal=true
            [ -n "$FALLBACK" ] && { ship="$FALLBACK"; via=fallback; }
          elif [ "$TESTED" = true ] || [ "$passed" = true ]; then ship="$SHA"; via=head
          elif [ -n "$FALLBACK" ] && [ "$FALLBACK" != "$SHA" ]; then ship="$FALLBACK"; via=fallback
          fi
          { echo "ship=$ship"; echo "via=$via"; echo "passed=$passed"; echo "rehearsal=$rehearsal"; } >> "$GITHUB_OUTPUT"
          echo "newest $SHA tested=$TESTED tests: $RESULTS -> ship ${ship:-nothing} via ${via:-none} (rehearsal=$rehearsal)" | tee -a "$GITHUB_STEP_SUMMARY"

  # The site of the fallback commit, only on the fallback path (the steps of `site`).
  site-fallback:
    needs: [ref, verdict]
    # !cancelled(): success() would also look at the failed test jobs behind `verdict`.
    if: ${{ !cancelled() && needs.verdict.result == 'success' && needs.verdict.outputs.via == 'fallback' }}
    runs-on: ubuntu-latest
    env:
      COMMIT: ${{ needs.verdict.outputs.ship }}
      SITE_ARTIFACT: site-fallback
    defaults:
      run:
        working-directory: apps/web
    steps: *site-steps

  # The data files, built from the newest commit in parallel with its tests (they do not depend on each other); they
  # deploy only if `verdict` takes the head path. `data-fallback` runs the same steps (YAML anchor) for the fallback
  # commit; COMMIT, API_ARTIFACT and RUN_KEY tell them apart (RUN_KEY keeps their cache keys apart).
  data:
    needs: [ref]
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    # Recent runs took 25 s to 12 min; a stuck run must not hold the runner for GitHub's 6 h default.
    timeout-minutes: 30
    env:
      COMMIT: ${{ needs.ref.outputs.sha }}
      API_ARTIFACT: api
      RUN_KEY: ${{ github.run_id }}
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps: &data-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: 1220mabe/sideboard-sage
          ssh-key: ${{ secrets.SOURCE_KEY }}
          persist-credentials: false
          ref: ${{ env.COMMIT }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - id: day
        run: echo "d=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      # Scryfall's bulk file, the MTGO checkout and the TopDeck.gg answers are kept per day, so
      # several deploys in one day reuse them (and a failing source falls back to the last answer).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: pipeline/data
          key: pipeline-data-${{ steps.day.outputs.d }}-${{ env.RUN_KEY }}
          restore-keys: |
            pipeline-data-${{ steps.day.outputs.d }}-
            pipeline-data-
      # A UI-only deploy reuses the last good data (cuts about 3 minutes); no cached copy means a normal build.
      - name: Reuse the last good data
        id: api
        if: ${{ inputs.reuse_data == true }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/web/public/api
          key: api-good-none
          restore-keys: api-good-
      - id: mode
        run: echo "build=${{ inputs.reuse_data == true && steps.api.outputs.cache-matched-key != '' && 'false' || 'true' }}" >> "$GITHUB_OUTPUT"
      - name: Build the static API (cards from Scryfall, tournaments from MTGO, TopDeck.gg and Spicerack)
        if: ${{ steps.mode.outputs.build == 'true' }}
        working-directory: pipeline
        env:
          TOPDECK_API_KEY: ${{ secrets.TOPDECK_API_KEY }}
          SPICERACK_API_KEY: ${{ secrets.SPICERACK_API_KEY }}
        run: |
          uv sync --locked
          # What is live now: the banned lists (a ban is a difference from them) and the Journal reports (a ban report
          # cannot be rebuilt from the data, so it is carried over). A failed fetch removes the file: no ban news, nothing lost.
          mkdir -p data ../apps/web/public/api/v1/news
          curl -fsS --max-time 20 --retry 2 "https://sideboard-sage.pages.dev/api/v1/legality.json" -o data/legality-before.json || rm -f data/legality-before.json
          # The format list is pipeline/formats.py (a new format needs no edit here).
          for f in $(uv run python -m sideboard_sage_pipeline.formats); do
            curl -fsS --max-time 20 --retry 2 "https://sideboard-sage.pages.dev/api/v1/news/$f.json" -o "../apps/web/public/api/v1/news/$f.json" || rm -f "../apps/web/public/api/v1/news/$f.json"
          done
          # Each format's price history as it is live now (Issue #425): today's point is added to it. A format with no file
          # yet (404) starts its history today; the pipeline ignores anything that is not a history file.
          mkdir -p data/prices-before
          for f in $(uv run python -m sideboard_sage_pipeline.formats); do
            curl -fsS --max-time 20 --retry 3 "https://sideboard-sage.pages.dev/api/v1/prices/$f-history.json" -o "data/prices-before/$f-history.json" || rm -f "data/prices-before/$f-history.json"
          done
          uv run python -m sideboard_sage_pipeline cards
          # Card names per language: one search each, cached in pipeline/data for a week; a failure keeps the cached copy.
          uv run python -m sideboard_sage_pipeline names
          uv run python -m sideboard_sage_pipeline api
          # Card roles for the playtest opponent, read from the local bulk file (no network); only the playtest loads them.
          uv run python -m sideboard_sage_pipeline roles
          uv run python -m sideboard_sage_pipeline metagame
          # Pictures for list cards in no format's card file (a set newer than the bulk file), via /cards/collection;
          # only asks when something is missing, and a failure only means card backs in the share images (Issue #249).
          uv run python -m sideboard_sage_pipeline unlisted-art || echo "unlisted art: skipped"
          # Token pictures for the playtest table, via /cards/collection; a failure only means the text frame (Issue #384).
          uv run python -m sideboard_sage_pipeline token-art || echo "token art: skipped"
      # Pre-publish gate (#135) with quarantine: data that fails it (exit 1) is not published. The run ships its code with the
      # last good data (the newest `api-good-` copy, saved below only after a pass) and still ends green, so nothing wedges.
      # With no copy, or one the code cannot read (pipeline quarantine.py), this run's data ships as before and the alert says so.
      # The problems (counts and names only, no source) go to Discord when the webhook is set.
      # The same findings alert once a day at most (#174): the key is a hash of the findings plus the date, kept in the Actions cache.
      - name: Data gate
        id: gate
        if: ${{ steps.mode.outputs.build == 'true' }}
        working-directory: pipeline
        env:
          FORCE: ${{ inputs.force_quarantine == true }}
        run: |
          # Exit 1 = a data problem, 2 = only late or disagreeing sources (alert, never block: the other sources' data ships).
          rc=0
          uv run python -m sideboard_sage_pipeline gate > gate.txt || rc=$?
          if [ "$FORCE" = true ]; then echo "gate: forced problem (force_quarantine test run)" >> gate.txt; rc=1; fi
          cat gate.txt
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "key=gate-alert-$(date -u +%F)-$(sed -E 's/[0-9]+:[0-9]+//g' gate.txt | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      # Quarantine: this run's folder goes aside, the last good copy comes back in its place (a cache restores only to the
      # path it was saved from), and `quarantine` keeps it or puts this run's folder back. Before "Deploy or skip", which
      # stamps this run's commit into whichever status.json ships.
      - name: Set this run's data aside
        if: steps.gate.outputs.rc == '1'
        run: mv apps/web/public/api apps/web/public/api.fresh
      - name: Restore the last good data
        if: steps.gate.outputs.rc == '1'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/web/public/api
          key: api-good-none
          restore-keys: api-good-
      - name: Quarantine
        id: quarantine
        if: steps.gate.outputs.rc == '1'
        working-directory: pipeline
        run: set -o pipefail; uv run python -m sideboard_sage_pipeline quarantine --fresh ../apps/web/public/api.fresh --last-good ../apps/web/public/api --github-output "$GITHUB_OUTPUT" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Data gate seen today
        if: steps.gate.outputs.rc != '' && steps.gate.outputs.rc != '0'
        id: gate-seen
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: pipeline/gate.txt
          key: ${{ steps.gate.outputs.key }}
          lookup-only: true
      - name: Data gate alert
        if: steps.gate.outputs.rc != '' && steps.gate.outputs.rc != '0' && steps.gate-seen.outputs.cache-hit != 'true'
        working-directory: pipeline
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RC: ${{ steps.gate.outputs.rc }}
          HELD: ${{ steps.quarantine.outputs.quarantined }}
          DATA_FROM: ${{ steps.quarantine.outputs.data_from }}
          REASON: ${{ steps.quarantine.outputs.reason }}
        run: |
          if [ "$RC" = 1 ] && [ "$HELD" = true ]; then
            HEAD="Data quarantined: this run's data failed the gate, so the site keeps the last good data (built $DATA_FROM) with this run's code"
          elif [ "$RC" = 1 ]; then
            HEAD="Data gate problem, not quarantined (${REASON:-quarantine did not run}): this run's data ships as before"
          else
            HEAD="Data gate warning (sources only, the data ships)"
          fi
          MSG="$HEAD: $RUN"$'\n'"$(head -c 1500 gate.txt)"
          [ -n "$HOOK" ] && curl -fsS --max-time 15 -H 'Content-Type: application/json' -d "$(jq -n --arg c "$MSG" '{content:$c}')" "$HOOK" || true
      - name: Data gate remember
        if: steps.gate.outputs.rc != '' && steps.gate.outputs.rc != '0' && steps.gate-seen.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: pipeline/gate.txt
          key: ${{ steps.gate.outputs.key }}
      # Cloudflare Pages allows 500 deploys a month (Issue #310): a scheduled run deploys only for new code, a big event the
      # live site lacks, changed data once the live build is 3.5 hours old, or an 8-hour-old live build
      # (pipeline deploy_check.py). A manual run always deploys, unless `as_schedule` (the backup schedule) makes it act
      # as a scheduled one. An unreadable live status means deploy.
      - name: Deploy or skip
        id: decide
        working-directory: pipeline
        env:
          SHA: ${{ env.COMMIT }}
          SCHEDULED: ${{ (github.event_name == 'schedule' || inputs.as_schedule == true) && '--scheduled' || '' }}
        run: |
          curl -fsS --max-time 20 --retry 2 "https://sideboard-sage.pages.dev/api/v1/status.json" -o live-status.json || rm -f live-status.json
          uv run python -m sideboard_sage_pipeline deploy-check --live live-status.json --commit "$SHA" $SCHEDULED --github-output "$GITHUB_OUTPUT" | tee -a "$GITHUB_STEP_SUMMARY"
      # The last good data, for a later quarantine and for UI-only deploys: saved only when the gate passed (exit 0 or 2).
      # actions/cache rather than an artifact: no extra token, restores by prefix, and a copy refreshed every 2 hours never
      # meets the 7-day eviction. A new prefix (not `api-built-`), so a copy saved before the gate decided is never trusted.
      - name: Keep the last good data
        if: ${{ steps.mode.outputs.build == 'true' && steps.gate.outputs.rc != '1' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/web/public/api
          key: api-good-${{ env.RUN_KEY }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.API_ARTIFACT }}
          path: apps/web/public/api
          retention-days: 1
          compression-level: 6

  # Deploys only after the checks pass, and only from main: the tested site plus the fresh data.
  # Turn on by setting the repo variable DEPLOY_ENABLED=true and adding the
  # secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. See docs/DEPLOY.md.
  # The pages are written while the browser tests run, so the deploy only uploads (about a minute off the critical path).
  # Building them is not shipping them: `deploy` takes this job's output only when `verdict` chose the head path.
  # `pages-fallback` runs the same steps (YAML anchor) for the fallback commit.
  pages:
    needs: [ref, site, data]
    if: ${{ !cancelled() && needs.site.result == 'success' && needs.data.result == 'success' && needs.data.outputs.deploy == 'true' && vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      COMMIT: ${{ needs.ref.outputs.sha }}
      SITE_ARTIFACT: site
      API_ARTIFACT: api
      PAGES_ARTIFACT: pages
      RUN_KEY: ${{ github.run_id }}
    steps: &pages-steps
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ env.SITE_ARTIFACT }}
          path: out
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ env.API_ARTIFACT }}
          path: out/api
      # Pages for every format, archetype and recent tournament, with their share images (docs/DEPLOY.md).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: 1220mabe/sideboard-sage
          ssh-key: ${{ secrets.SOURCE_KEY }}
          persist-credentials: false
          ref: ${{ env.COMMIT }}
          path: repo
          sparse-checkout: apps/web
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: repo/apps/web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: repo/apps/web/pnpm-lock.yaml
      # Unchanged images are copied, not drawn again. A run saves the cache only when its file list changed (names are
      # content keys), so runs that drew nothing new add no ~180 MB entry to the 10 GB Actions cache.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: og-cache
          key: og-${{ env.RUN_KEY }}
          restore-keys: og-
      - name: List the restored images
        id: og_before
        run: echo "list=$(mkdir -p og-cache && find og-cache -type f | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Install the page writer
        working-directory: repo/apps/web
        run: pnpm install --frozen-lockfile
      # PROVENANCE_KEY keys the data-file stamp (scripts/provenance.mjs, docs/SECURITY.md); without it the stamp is
      # unkeyed and the deploy goes on. Only this step sees it: install scripts never do.
      - name: Write the format, archetype and tournament pages
        working-directory: repo/apps/web
        env:
          PROVENANCE_KEY: ${{ secrets.PROVENANCE_KEY }}
        run: pnpm seo --site "$GITHUB_WORKSPACE/out" --cache "$GITHUB_WORKSPACE/og-cache" --budget 120
      # The weekly SNS finding's picture (Issue #266): drawn only when data/sns_findings.json has a finding; never blocks the deploy.
      - name: Draw the SNS finding picture
        continue-on-error: true
        working-directory: repo/apps/web
        run: pnpm finding-image --site "$GITHUB_WORKSPACE/out" --file "$GITHUB_WORKSPACE/repo/data/sns_findings.json"
      - name: Draw the SNS sideboard finding picture
        continue-on-error: true
        working-directory: repo/apps/web
        run: pnpm finding-image --site "$GITHUB_WORKSPACE/out" --file "$GITHUB_WORKSPACE/repo/data/sns_side.json"
      # The weekly matchup-matrix post's pictures: one per format with a usable matrix; the poster picks the one that is due. Never blocks the deploy.
      - name: Draw the matchup matrix pictures
        continue-on-error: true
        working-directory: repo/apps/web
        run: pnpm matrix-image --site "$GITHUB_WORKSPACE/out"
      # The Limited set report's pictures (Issue #445): only for a set whose data reached day 7 or 21, or that just closed. Never blocks the deploy.
      - name: Draw the Limited set report pictures
        continue-on-error: true
        working-directory: repo/apps/web
        run: pnpm limited-image --site "$GITHUB_WORKSPACE/out" --cache "$GITHUB_WORKSPACE/og-cache"
      - name: List the images to keep
        id: og_after
        run: echo "list=$(find og-cache -type f | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - if: ${{ steps.og_after.outputs.list != steps.og_before.outputs.list }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: og-cache
          key: og-${{ env.RUN_KEY }}
      # Every internal link on the built pages must land on a page (a finish pointing at an event page that was never
      # written is invisible to unit tests). Warns first; turn on `--max 0` as a hard stop once a run has shown it clean.
      - name: Check the internal links
        working-directory: repo/apps/web
        run: node scripts/internal-links.mjs --site "$GITHUB_WORKSPACE/out" --max 0
      # Issue #493: each sitemap.xml page should be linked from two other built pages in their static HTML. Warnings only.
      - name: Count the links into the sitemap pages
        continue-on-error: true
        working-directory: repo/apps/web
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/seo-audit.mjs "$GITHUB_WORKSPACE/out" --inbound
      - name: Count the files (Cloudflare Pages allows 20,000)
        working-directory: repo/apps/web
        run: node scripts/budget.mjs --files --site "$GITHUB_WORKSPACE/out"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.PAGES_ARTIFACT }}
          path: out
          compression-level: 0
          retention-days: 1

  # The fallback path (`verdict` via=fallback): the newest commit failed a test, so the newest earlier commit that passed
  # them is rebuilt with fresh data, after the verdict (only on a failing main, so the head path keeps its speed).
  data-fallback:
    needs: [ref, verdict]
    if: ${{ !cancelled() && needs.verdict.result == 'success' && needs.verdict.outputs.via == 'fallback' && vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    env:
      COMMIT: ${{ needs.verdict.outputs.ship }}
      API_ARTIFACT: api-fallback
      RUN_KEY: ${{ github.run_id }}-fallback
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps: *data-steps

  pages-fallback:
    needs: [ref, verdict, site-fallback, data-fallback]
    if: ${{ !cancelled() && needs.verdict.outputs.via == 'fallback' && needs.site-fallback.result == 'success' && needs.data-fallback.result == 'success' && needs.data-fallback.outputs.deploy == 'true' && vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      COMMIT: ${{ needs.verdict.outputs.ship }}
      SITE_ARTIFACT: site-fallback
      API_ARTIFACT: api-fallback
      PAGES_ARTIFACT: pages-fallback
      RUN_KEY: ${{ github.run_id }}-fallback
    steps: *pages-steps

  deploy:
    # One deploy at a time, in order: two overlapping deploys could ship out of order and post twice.
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    needs: [ref, verdict, pages, pages-fallback]
    # The test gate is `verdict` alone. Head path: the newest commit's pages, only when it was tested before or passed
    # every test now. Fallback path: the pages of the newest earlier commit that passed. Nothing else is ever uploaded,
    # and failed tests of the newest commit still fail the run and alert. A run whose data did not change skips the
    # pages job, and with it this one (Issue #310). A force_fallback rehearsal runs this job without uploading or posting.
    if: ${{ !cancelled() && needs.verdict.result == 'success' && vars.DEPLOY_ENABLED == 'true' && (needs.verdict.outputs.via == 'head' && needs.verdict.outputs.ship == needs.ref.outputs.sha && needs.pages.result == 'success' || needs.verdict.outputs.via == 'fallback' && needs.pages-fallback.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Posting secrets are not in the job env: install, build and the Cloudflare deploy never see them. Only the
    # steps that post get them, and the `flags` step (in the `ref` job) tells them which ones are set.
    env:
      COMMIT: ${{ needs.verdict.outputs.ship }}
      PAGES_ARTIFACT: ${{ needs.verdict.outputs.via == 'fallback' && 'pages-fallback' || 'pages' }}
      # false in a force_fallback rehearsal: no upload, no smoke test, no search-engine ping, no posts.
      LIVE: ${{ needs.verdict.outputs.rehearsal != 'true' }}
      X_POSTING: ${{ vars.X_POSTING }}
      SOCIAL_POSTING: ${{ vars.SOCIAL_POSTING }}
      X_MONTHLY_CAP: ${{ vars.X_MONTHLY_CAP }}
      X_DAILY_CAP: ${{ vars.X_DAILY_CAP }}
      BUFFER_POSTING: ${{ vars.BUFFER_POSTING }}
      BUFFER_DAILY_CAP: ${{ vars.BUFFER_DAILY_CAP }}
      BUFFER_X_PER_DAY: ${{ vars.BUFFER_X_PER_DAY }}
      BUFFER_X_MODE: ${{ vars.BUFFER_X_MODE }}
      BUFFER_MIN_GAP_MIN: ${{ vars.BUFFER_MIN_GAP_MIN }}
      BUFFER_X_PER_RUN: ${{ vars.BUFFER_X_PER_RUN }}
      BUFFER_MONTHLY_CAP: ${{ vars.BUFFER_MONTHLY_CAP }}
      BUFFER_LEAGUE_RESERVE: ${{ vars.BUFFER_LEAGUE_RESERVE }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ env.PAGES_ARTIFACT }}
          path: out
      # pipeline and data/partners (with data/sources.yaml beside it) only for the partner pages below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: 1220mabe/sideboard-sage
          ssh-key: ${{ secrets.SOURCE_KEY }}
          persist-credentials: false
          ref: ${{ env.COMMIT }}
          path: repo
          sparse-checkout: |
            apps/web
            pipeline
            data/partners
      # Private partner report pages (Issue #313, /partners/<key>/): written here, after the last artifact upload and
      # right before the Cloudflare upload, because artifacts of the public runner repo can be downloaded by anyone.
      # The ledger decides: a removed partner block means no page in this deploy. Nothing is printed but a count.
      - name: Any partners?
        id: partners
        run: echo "any=$(grep -qE '^ +partner:' repo/data/sources.yaml && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: ${{ steps.partners.outputs.any == 'true' }}
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: repo/pipeline/uv.lock
      - name: Write the partner report pages
        if: ${{ steps.partners.outputs.any == 'true' }}
        working-directory: repo/pipeline
        run: uv run --locked python -m sideboard_sage_pipeline partner-pages --out "$GITHUB_WORKSPACE/out/partners"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: repo/apps/web/package.json
      # No pull request or fork triggers here: only this repository's own runs write the cache.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7 # zizmor: ignore[cache-poisoning]
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: repo/apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: repo/apps/web
      # What is live right now, saved before the deploy so the announcement step can tell which tournaments are new.
      # A format whose index cannot be fetched is skipped: announce nothing rather than flood the channel.
      - name: Save the live tournament indexes
        if: ${{ github.event_name == 'schedule' || inputs.post }}
        continue-on-error: true
        env:
          CATCHUP_DAYS: ${{ inputs.catchup_days }}
        run: |
          mkdir -p prev-indexes
          for dir in out/api/v1/tournaments/*/; do
            f=$(basename "$dir")
            curl -fsS --max-time 15 --retry 2 "https://sideboard-sage.pages.dev/api/v1/tournaments/$f/index.json" -o "prev-indexes/$f.json" || rm -f "prev-indexes/$f.json"
          done
          # Catch-up after a halt: forget the newest days, so those tournaments count as new. The announce cap still
          # applies and the X and social ledgers skip anything already posted.
          days="$CATCHUP_DAYS"
          case "$days" in 1|2) cutoff=$(date -u -d "$((days - 1)) days ago" +%F)
            for f in prev-indexes/*.json; do [ -f "$f" ] && jq --arg c "$cutoff" 'if .events then .events |= map(select(.date < $c)) else . end' "$f" > "$f.tmp" && mv "$f.tmp" "$f"; done
            # The news index is left alone: reports are announced by their own rule.
            ;; esac
          # The Journal reports that were live: the ones not in it are new (a missing file announces no report).
          curl -fsS --max-time 15 --retry 2 "https://sideboard-sage.pages.dev/api/v1/news/index.json" -o prev-indexes/news-index.json || rm -f prev-indexes/news-index.json
      # The live sitemaps, so the IndexNow step after the deploy sends only new or re-dated addresses (none if missing).
      - name: Save the live sitemaps
        continue-on-error: true
        run: |
          mkdir -p prev-sitemaps
          for f in sitemap.xml sitemap-pages.xml; do
            curl -fsS --max-time 20 --retry 2 "https://sideboard-sage.pages.dev/$f" -o "prev-sitemaps/$f" || rm -f "prev-sitemaps/$f"
          done
      - if: ${{ env.LIVE == 'true' }}
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=sideboard-sage --branch=main
      # Post-deploy smoke test (Issue #100): about 10 seconds. Key pages answer 200 and the JSON just shipped is the
      # build in `out` and not an empty file. Failure only alerts (Discord); a rollback stays a manual dashboard step.
      - name: Smoke test the deployed site
        if: ${{ env.LIVE == 'true' }}
        continue-on-error: true
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          base="https://sideboard-sage.pages.dev"
          fail=""
          # The metagame file is the first format the data lists (formats.json), so a renamed format needs no edit here.
          first=$(jq -r '.formats[0] // "standard"' out/api/v1/formats.json 2>/dev/null || echo standard)
          for p in / /tournaments/ /meta/ /decks/ /api/v1/status.json "/api/v1/metagame/$first.json"; do
            curl -fsS --max-time 20 --retry 4 --retry-delay 5 --retry-all-errors -o /dev/null "$base$p" || fail="$fail $p"
          done
          want=$(jq -r .generated_at out/api/v1/status.json)
          live=$(curl -fsS --max-time 20 --retry 4 --retry-delay 5 "$base/api/v1/status.json" | jq -r .generated_at || true)
          [ "$want" = "$live" ] || fail="$fail status-not-fresh($live)"
          [ -z "$fail" ] && { echo "smoke ok"; exit 0; }
          echo "::error::smoke test failed:$fail"
          [ -n "$HOOK" ] && curl -fsS --max-time 15 -H 'Content-Type: application/json' -d "$(jq -n --arg c "Post-deploy smoke test failed:$fail. Roll back in the Cloudflare dashboard if the site is broken (docs/DEPLOY.md). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{content:$c}')" "$HOOK" || true
          exit 1
      # IndexNow (Bing, Yandex, Naver, Seznam): the new and re-dated sitemap addresses, one POST, never fails the job.
      - name: Tell search engines what changed
        if: ${{ env.LIVE == 'true' }}
        continue-on-error: true
        working-directory: repo/apps/web
        run: pnpm indexnow --out "$GITHUB_WORKSPACE/out" --previous "$GITHUB_WORKSPACE/prev-sitemaps"
      # Optional automatic posting to X (docs/OPERATIONS.md, "X posting"). Does nothing without all four secrets or
      # when the variable X_POSTING is "off". The ledger (posted ids and the monthly counter) lives in the Actions cache.
      - name: Restore X ledger
        id: xledger
        if: ${{ env.LIVE == 'true' && (github.event_name == 'schedule' || inputs.post) && needs.ref.outputs.x == 'true' && env.X_POSTING != 'off' }}
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: x-ledger
          key: x-ledger-${{ github.run_id }}
          restore-keys: x-ledger-
      # Fail closed (#111): a lost cache entry would reset the monthly counter and bypass the cap, so without a
      # restored ledger nothing is posted. The first ever run sets the variable X_LEDGER_INIT=true (docs/OPERATIONS.md).
      - name: Post to X
        if: ${{ env.LIVE == 'true' && (github.event_name == 'schedule' || inputs.post) && needs.ref.outputs.x == 'true' && env.X_POSTING != 'off' && (steps.xledger.outputs.cache-matched-key != '' || vars.X_LEDGER_INIT == 'true') }}
        continue-on-error: true
        working-directory: repo/apps/web
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: pnpm x-post --data "$GITHUB_WORKSPACE/out/api/v1" --previous "$GITHUB_WORKSPACE/prev-indexes" --ledger "$GITHUB_WORKSPACE/x-ledger/ledger.json"
      - name: Save X ledger
        if: ${{ always() && hashFiles('x-ledger/ledger.json') != '' }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: x-ledger
          key: x-ledger-${{ github.run_id }}
      # Optional free posting to X through Buffer's free plan (docs/OPERATIONS.md, "Buffer posting"). Does nothing
      # without both secrets or when the variable BUFFER_POSTING is "off". Own ledger in the Actions cache; fail closed
      # like the X ledger: without a restored ledger nothing is posted unless X_LEDGER_INIT is "true" (first run only).
      - name: Restore Buffer ledger
        id: bufledger
        if: ${{ env.LIVE == 'true' && (github.event_name == 'schedule' || inputs.post) && (needs.ref.outputs.buffer == 'true' && env.BUFFER_POSTING != 'off' || needs.ref.outputs.discord == 'true') }}
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: buffer-ledger
          key: buffer-ledger-${{ github.run_id }}
          restore-keys: buffer-ledger-
      # The one dispatch path (docs/OPERATIONS.md, "One dispatch path"): every item goes to Buffer and to Discord from here, one
      # ledger entry per item and channel, a failed channel is retried on later runs, and Discord says when Buffer did not post.
      - name: Post to X through Buffer and to Discord
        id: dispatch
        if: ${{ env.LIVE == 'true' && (github.event_name == 'schedule' || inputs.post) && (needs.ref.outputs.buffer == 'true' && env.BUFFER_POSTING != 'off' || needs.ref.outputs.discord == 'true') && (steps.bufledger.outputs.cache-matched-key != '' || vars.X_LEDGER_INIT == 'true') }}
        continue-on-error: true
        working-directory: repo/apps/web
        env:
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: pnpm buffer-post --data "$GITHUB_WORKSPACE/out/api/v1" --previous "$GITHUB_WORKSPACE/prev-indexes" --ledger "$GITHUB_WORKSPACE/buffer-ledger/ledger.json"
      # Discord-only fallback (docs/OPERATIONS.md, "One dispatch path"): when the Buffer/Discord dispatch above did not run (no Buffer
      # secrets, Buffer off, or its ledger missing), new tournaments still go to the team's Discord channel. Never blocks a deploy.
      - name: Announce new tournaments
        if: ${{ env.LIVE == 'true' && (github.event_name == 'schedule' || inputs.post) && needs.ref.outputs.discord == 'true' && steps.dispatch.outcome != 'success' }}
        continue-on-error: true
        working-directory: repo/apps/web
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: pnpm announce --data "$GITHUB_WORKSPACE/out/api/v1" --previous "$GITHUB_WORKSPACE/prev-indexes"
      - name: Save Buffer ledger
        if: ${{ always() && hashFiles('buffer-ledger/ledger.json') != '' }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: buffer-ledger
          key: buffer-ledger-${{ github.run_id }}
      # Optional free posting to Bluesky and Mastodon (docs/OPERATIONS.md). Each network needs its own secrets; the
      # variable SOCIAL_POSTING set to "off" stops both. Its own ledger keeps one post per item per network.
      - name: Restore social ledger
        if: ${{ env.LIVE == 'true' && (github.event_name == 'schedule' || inputs.post) && needs.ref.outputs.social == 'true' && env.SOCIAL_POSTING != 'off' }}
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: social-ledger
          key: social-ledger-${{ github.run_id }}
          restore-keys: social-ledger-
      - name: Post to Bluesky, Mastodon, Threads and Instagram
        if: ${{ env.LIVE == 'true' && (github.event_name == 'schedule' || inputs.post) && needs.ref.outputs.social == 'true' && env.SOCIAL_POSTING != 'off' }}
        continue-on-error: true
        working-directory: repo/apps/web
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          THREADS_DAILY_CAP: ${{ vars.THREADS_DAILY_CAP }}
          BSKY_DAILY_CAP: ${{ vars.BSKY_DAILY_CAP }}
          MASTODON_DAILY_CAP: ${{ vars.MASTODON_DAILY_CAP }}
          INSTAGRAM_DAILY_CAP: ${{ vars.INSTAGRAM_DAILY_CAP }}
        run: pnpm social-post --data "$GITHUB_WORKSPACE/out/api/v1" --previous "$GITHUB_WORKSPACE/prev-indexes" --ledger "$GITHUB_WORKSPACE/social-ledger/ledger.json"
      - name: Save social ledger
        if: ${{ always() && hashFiles('social-ledger/ledger.json') != '' }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: social-ledger
          key: social-ledger-${{ github.run_id }}

  # Remembers that every test passed for this commit, so the next runs skip them (and can fall back to it).
  mark:
    needs: [ref, verdict]
    if: ${{ !cancelled() && needs.verdict.outputs.passed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: mkdir .tested && echo ok > .tested/ok
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tested
          key: tested-${{ needs.ref.outputs.sha }}

  # A failed run must not go unnoticed: a Discord message with the run link (a public Issue would show the failure to
  # everyone). GitHub also emails the owner about a failed scheduled run. failure() covers every job before these, so
  # failed tests on main alert on every run, even when the fallback commit was deployed.
  alert:
    needs: [ref, verdict, data, site, data-fallback, site-fallback, deploy, mark]
    if: ${{ failure() && needs.ref.outputs.discord == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ needs.ref.outputs.sha }}
          TESTED: ${{ needs.ref.outputs.tested }}
          PASSED: ${{ needs.verdict.outputs.passed }}
          SHIP: ${{ needs.verdict.outputs.ship }}
          REHEARSAL: ${{ needs.verdict.outputs.rehearsal }}
          DATA: ${{ needs.data-fallback.result }}
          DUE: ${{ needs.data-fallback.outputs.deploy }}
          DEPLOY: ${{ needs.deploy.result }}
        run: |
          if [ "$TESTED" = true ] || [ "$PASSED" = true ]; then
            MSG="Refresh or deploy failed, the site keeps the last good data: $RUN"
          elif [ -z "$SHIP" ]; then
            MSG="Tests fail on main ${SHA:0:7} and no earlier tested commit was found: nothing is deployed and the data is not refreshed until main passes: $RUN"
          else
            if [ "$REHEARSAL" = true ]; then d="force_fallback rehearsal: nothing was uploaded"
            elif [ "$DEPLOY" = success ]; then d="this run deployed it with fresh data"
            elif [ "$DATA" = success ] && [ "$DUE" != true ]; then d="no deploy was due this run"
            else d="but this run's refresh or deploy of it failed too, the site keeps the last good data"; fi
            MSG="Tests fail on main ${SHA:0:7}: the site stays on the last tested commit ${SHIP:0:7} until main passes ($d): $RUN"
          fi
          curl -fsS --max-time 15 -H 'Content-Type: application/json' -d "$(jq -n --arg c "$MSG" '{content:$c}')" "$HOOK" || true
